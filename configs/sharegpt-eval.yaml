# ----- pairs to profile (priority over `models:` + `backends:` if both present) -----
pairs:
  # A100 Experiments:
  # - [meta-llama/Llama-3.1-8B, FLASHINFER]
  # - [Qwen/Qwen3-30B-A3B, FLASHINFER]
  # - [Qwen/Qwen3-32B, FLASHINFER]
  # - [CohereLabs/c4ai-command-r7b-12-2024, FLASHINFER]
  # H100 Experiments:
  # - [meta-llama/Llama-3.1-8B, FLASHINFER]
  # - [Qwen/Qwen3-32B, FLASHINFER]
  - [Qwen/Qwen3-14B, FLASHINFER] # dense, bigger
  # - [mistralai/Mixtral-8x7B-Instruct-v0.1, FLASHINFER] # fp8 quantized moe
  # - [mistralai/Ministral-8B-Instruct-2410, FLASHINFER] # dense, interleaved heterogeneous 
# ----- output paths -----
paths:
  db_path:       /home/ubuntu/dooly/h100-workspace/database/h100-sharegpt-eval.db
  workspace_dir: /home/ubuntu/dooly/h100-workspace/sharegpt/

# ----- sweep space passed to run-e2e (per-pair) -----
sweep:
  max_batch_size: 32
  max_seq_len:    16384
  tp:             1

# ----- GPU placement -----
gpus:
  num_gpus: 1
  # gpu_ids: "0,1"      # uncomment to pin to specific GPUs (overrides num_gpus)
